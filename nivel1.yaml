
#cloud-config
package_update: true

packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    owner: root:root
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html lang="pt-BR">
      <head>
        <meta charset="UTF-8">
        <title>Meu primeiro servidor</title>
      </head>
      <body>
        <h1>Bem-vindo ao meu servidor web!</h1>
        <p>Configurado automaticamente com Cloud-init e Multipass.</p>
      </body>
      </html>

runcmd:
  - systemctl restart nginx
